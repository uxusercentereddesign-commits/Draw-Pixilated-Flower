<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draw Pixilated Flower</title>
    <link rel="icon" type="image/png" href="/Pixlated flower.png" />
    <meta name="description" content="Create your own pixelated flower and download your artwork." />
    <!-- Open Graph -->
    <meta property="og:url" content="https://pixelatedflower.vercel.app/" />
    <meta property="og:title" content="Draw Pixilated Flower" />
    <meta property="og:description" content="Create your own pixelated flower and download your artwork." />
    <meta property="og:image" content="https://pixelatedflower.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Draw Pixilated Flower" />
    <meta name="twitter:description" content="Create your own pixelated flower and download your artwork." />
    <meta name="twitter:image" content="https://pixelatedflower.vercel.app/og-image.png" />
    <link rel="stylesheet" href="src/style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400&display=swap" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>
  <body>
    <div id="grid"></div>
    <div id="canvas">
     <h1 class="canvas__label">Where Pixels Bloom</h1>
     <div class="canvas__wrapper">
      <div class="canvas__row">
        <div class="canvas__controls canvas__controls--left">
          <button class="icon-button icon-button--undo"><i class="ph-bold ph-arrow-counter-clockwise"></i></button>
        </div>
        <div id="canvas-box" data-visible="false"></div>
        <div class="canvas__controls canvas__controls--right">
          <button class="icon-button icon-button--visibility">
            <i class="ph-bold ph-eye-slash"></i>
            <i class="ph-bold ph-eye"></i>
          </button>
          <button class="icon-button icon-button--download" disabled><i class="ph-bold ph-download-simple"></i></button>
        </div>
      </div>
      <div class="palette" data-active-color="1">
        <div class="palette__swatches">
          <button class="palette__swatch" data-color="1" data-active="true"></button>
          <button class="palette__swatch" data-color="2"></button>
          <button class="palette__swatch" data-color="3"></button>
          <button class="palette__swatch" data-color="4"></button>
          <button class="palette__swatch" data-color="5"></button>
        </div>
        <div class="palette__shades">
          <button class="palette__shade" data-level="700" data-stagger="1"></button>
          <button class="palette__shade" data-level="500" data-stagger="2"></button>
          <button class="palette__shade" data-level="300" data-stagger="3"></button>
          <button class="palette__shade" data-level="100" data-stagger="4"></button>
        </div>
      </div>
     </div>
     <button class="controls__upload"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:12px;margin-bottom:1px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add Reference Image</button>
    </div>
<div class="flowers flowers--left" aria-hidden="true">
  <img src="/left1.png" class="flowers__img flowers__img--wind-a" data-flower="l1" style="--gap: -100px" alt="">
  <img src="/left2.png" class="flowers__img flowers__img--wind-b" data-flower="l2" style="--gap: -20px" alt="">
  <img src="/left 3.png" class="flowers__img flowers__img--wind-c" data-flower="l3" style="--gap: -40px" alt="">
  <img src="/left4.png" class="flowers__img flowers__img--wind-d" data-flower="l4" alt="">
</div>
<div class="flowers flowers--right" aria-hidden="true">
  <img src="/right2.png" class="flowers__img flowers__img--wind-c" data-flower="r2" alt="">
  <img src="/right1.png" class="flowers__img flowers__img--wind-b" data-flower="r1" style="--gap: -55px" alt="">
  <img src="/right3.png" class="flowers__img flowers__img--wind-c" data-flower="r3" style="--gap: -110px" alt="">
</div>
<div id="device-block" aria-hidden="true">
      <p class="device-block__text">Open this link on a<br>laptop to draw</p>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
