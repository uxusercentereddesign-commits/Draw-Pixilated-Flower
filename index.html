<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1024, initial-scale=1.0" />
    <title>Draw Pixilated Flower</title>
    <link rel="stylesheet" href="src/style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400&display=swap" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>
  <body>
    <main id="grid"></main>
    <div id="drawing-wrapper">
      <p id="canvas-label">Draw in pixels</p>
      <div id="canvas-box">
        <button class="redo"><i class="ph-bold ph-arrow-counter-clockwise"></i></button>
        <button class="eye-toggle"><i class="ph-bold ph-eye"></i></button>
        <button class="save-btn"><i class="ph-bold ph-download-simple"></i></button>
      </div>
      <div id="palette">
        <button class="swatch active"></button>
        <button class="swatch"></button>
        <button class="swatch"></button>
        <button class="swatch"></button>
        <button class="swatch"></button>
      </div>
      <button class="upload-btn">Pixel my image</button>
    </div>
    <div id="paint-cursor"><i class="ph ph-paint-bucket"></i></div>
    <div id="device-block">
      <p>Open this link on a<br>laptop to draw</p>
    </div>
    <script src="main.js"></script>
  </body>
</html>
