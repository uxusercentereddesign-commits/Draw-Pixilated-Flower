<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draw Pixilated Flower</title>
    <meta name="description" content="Create beautiful pixelated flowers, pixel by pixel. A relaxing pixel art drawing experience." />
    <!-- Open Graph -->
     <meta property="og:url" content="https://draw-pixilated-flower.vercel.app/" />
    <meta property="og:title" content="Draw Pixilated Flower" />
    <meta property="og:description" content="Create beautiful pixelated flowers, pixel by pixel. A relaxing pixel art drawing experience." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/Pixlated flower large size.png" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Draw Pixilated Flower" />
    <meta name="twitter:description" content="Create beautiful pixelated flowers, pixel by pixel. A relaxing pixel art drawing experience." />
    <meta name="twitter:image" content="/Pixlated flower large size.png" />
    <meta name="twitter:url" content="https://draw-pixilated-flower.vercel.app/" />
    <link rel="stylesheet" href="src/style.css" />
    <link rel="icon" type="image/png" href="/Pixlated flower.png" sizes="64x64" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400&display=swap" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>
  <body>
    <div id="grid"></div>
    <div id="canvas">
     <h1 id="canvas-label">Where Pixels Bloom</h1>
     <div id="drawing-wrapper">
      <div id="canvas-row">
        <div class="canvas-side left">
          <button class="redo"><i class="ph-bold ph-arrow-counter-clockwise"></i></button>
        </div>
        <div id="canvas-box" class="image-hidden"></div>
        <div class="canvas-side right">
          <button class="eye-toggle">
            <i class="ph-bold ph-eye-slash"></i>
            <i class="ph-bold ph-eye"></i>
          </button>
          <button class="save-btn" disabled><i class="ph-bold ph-download-simple"></i></button>
        </div>
      </div>
      <div id="palette">
        <button class="swatch active"></button>
        <button class="swatch"></button>
        <button class="swatch"></button>
        <button class="swatch"></button>
        <button class="swatch"></button>
      </div>
     </div>
     <button class="upload-btn">Add a reference image</button>
    </div>
<div id="device-block" aria-hidden="true">
      <p>Open this link on a<br>laptop to draw</p>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
