<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draw Pixilated Flower</title>
    <link rel="icon" type="image/png" href="/Pixlated flower.png" />
    <meta name="description" content="Create your own pixelated flower and download your artwork." />
    <!-- Open Graph -->
    <meta property="og:url" content="https://draw-pixelated-flower.vercel.app/" />
    <meta property="og:title" content="Draw Pixilated Flower" />
    <meta property="og:description" content="Create your own pixelated flower and download your artwork." />
    <meta property="og:image" content="https://draw-pixelated-flower.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Draw Pixilated Flower" />
    <meta name="twitter:description" content="Create your own pixelated flower and download your artwork." />
    <meta name="twitter:image" content="https://draw-pixelated-flower.vercel.app/og-image.png" />
    <link rel="stylesheet" href="src/style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400&display=swap" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>
  <body>
    <div id="grid"></div>
    <div id="canvas">
     <h1 id="canvas-label">Where Pixels Bloom</h1>
     <div id="drawing-wrapper">
      <div id="canvas-row">
        <div class="canvas-side left">
          <button class="redo"><i class="ph-bold ph-arrow-counter-clockwise"></i></button>
        </div>
        <div id="canvas-box" class="image-hidden"></div>
        <div class="canvas-side right">
          <button class="eye-toggle">
            <i class="ph-bold ph-eye-slash"></i>
            <i class="ph-bold ph-eye"></i>
          </button>
          <button class="save-btn" disabled><i class="ph-bold ph-download-simple"></i></button>
        </div>
      </div>
      <div id="palette-wrapper">
        <div id="palette">
          <button class="swatch active"></button>
          <button class="swatch"></button>
          <button class="swatch"></button>
          <button class="swatch"></button>
          <button class="swatch"></button>
        </div>
        <div id="shade-palette">
          <button class="swatch-700"></button>
          <button class="swatch-500"></button>
          <button class="swatch-300"></button>
          <button class="swatch-100"></button>
        </div>
      </div>
     </div>
     <button class="upload-btn"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:12px;margin-bottom:1px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add Reference Image</button>
    </div>
<div class="corner-flowers corner-flowers--left" aria-hidden="true">
  <img src="/left1.png" class="flower-img flower-wind-1" alt="">
  <img src="/left2.png" class="flower-img flower-wind-2" alt="">
  <img src="/left 3.png" class="flower-img flower-wind-3" alt="">
  <img src="/left4.png" class="flower-img flower-wind-4" alt="">
</div>
<div class="corner-flowers corner-flowers--right" aria-hidden="true">
  <img src="/right1.png" class="flower-img flower-wind-2" alt="">
  <img src="/right2.png" class="flower-img flower-wind-3" alt="">
</div>
<div id="device-block" aria-hidden="true">
      <p>Open this link on a<br>laptop to draw</p>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
